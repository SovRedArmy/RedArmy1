epochs: 360
eval_epochs: 30
warmup_epochs: 30
rate_steps: 8
log_epochs: -2
opt: adam
lr: 2e-3
warmup_lr: 1e-5
min_lr: 1e-4
max_norm: 1.0
weight_decay: 1e-6
weight_decay_scaling: true
auto_lr_scaling: true
# C5：渐进剪枝 + NVRC 原生率感知联合训练（ar/d-axis 熵模型 + 软退火 + D/R交替已内建）
# 剪枝调度：ep60 起每 10ep 剪一步，ep300 达到 15%（模型在率约束下主动适应稀疏）
prog_prune_target: 0.15
prog_prune_start: 60
prog_prune_end: 300
prog_prune_every: 10
