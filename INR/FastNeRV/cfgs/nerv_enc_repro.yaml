# =============================================================
# Fast-NeRV (ECCV 2024) 论文主实验复现配置
# 对应论文 Table 2 默认设置（附录 0.A.5）：
#   - 8 帧、256x256、patch 64x64（patch_t=1），可学习位置编码
#   - NeRV 子网: strds 4_4_4_4, ks 1_3_3_3, hid_dim 16, GELU, out_bias 0.5
#   - 权重 tokens: num 4_128_64_0, dim 256_144_288_0（layer-adaptive）
#   - 超网络: 6 层 / hidden 720 / FFN 2880≈2800（ViT-720 预设，约 47.6M）
#   - AdamW lr 1e-4, batch 32, step 衰减(90%/98%), 150 epoch, MSE 损失
#   - 训练集: K400 子集 10k 视频（论文 25 video x 400 class）
# 预期结果（论文 Table 2, 8 帧行）: Train/K400/UCF101 PSNR = 25.8/25.8/25.2
# =============================================================
trainer: enc_trainer
zero_center: False
use_amp: False
log_every_n: 50

train_dataset:
  name: video_dataset
  args: {root_path: data/dataset_meta/meta, split: train,
    frame_num: $frame_num$, csv_file: $csv_file$, t_duration: $t_duration$,
    cls_vid_num: '400_25', crop_size: $input_size$, resize: True, rand_flip: False,
    decode_type: 'torchvision', lmdb_root: '', }
  loader:
    batch_size: $batch_size$
    num_workers: $num_workers$

test_dataset:
  name: video_dataset
  args: {root_path: data/dataset_meta/meta, frame_num: $frame_num$, t_duration: $t_duration$,
    cls_vid_num: '400_1000000', crop_size: $input_size$, resize: True, }
  csv_paths: {k400: k400_val_paper.csv, ucf101: ucf101_test_paper.csv}
  loader:
    batch_size: $batch_size$
    num_workers: $num_workers$

model:
  name: nerv_enc
  args:
    tokenizer:
      name: vid_tokenizer
      args: {input_size: $input_size$, patch_hw: 64, patch_t: 1,
        frame_num: $frame_num$, learn_pe: True}
    hyponet:
      name: nerv_model
      args: {frame_num: $frame_num$, in_dim: 1, out_dim: 3, strds: '4_4_4_4',
        ks: '1_3', hid_dim: 16, act: 'gelu', out_bias: 0.5, out_range: 'no',
        pos_embed: 'inr_1024', pe_dim: 16, learn_pe: True}
    nerv_tokens: {
      token_nums: '4_128_64_0',   # layer-adaptive tokens（论文 Fig.3 右）
      token_dims: '256_144_288_0',
      token_init_std: 0.02,
      z_type: 'nerv',
      z_dim: 256,
      repeat_dim: -2,
      z_norm: 'bn_bn',
      z_norm_first: False,
    }
    transformer_encoder: {
      name: 'ViT-720',
      proj_drop: 0.,
      attn_drop: 0.,
      mlp_drop: 0.,
      }
    kl_layer: {
      kl_weight: 1.5e-06,   # 同官方脚本 n0.sh
      deterministic: False,
      avg_kl: False
    }
optimizer:
  name: adamw
  args: {lr: 1.e-4, weight_decay: 0.0}
  lr_type: step
  loss_weights: '1_0_0'   # 纯 MSE（论文 Eq.1）
  epoch_cycles: 1
  cycle_decay: 1.0
  full_cosine: False
max_epoch: 150
eval_epoch: 50
vis_epoch: 50
save_epoch: 100
vis_n: 8
dump_pred: 'no'
dump_video: 'no'
dump_vid_grid: 'no'
eval_model: 'no'
resume_ckt: 'no'
log_every_n: 50
