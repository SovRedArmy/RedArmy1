# UAR-NVC Conda Environment Configuration
# Paper: UAR-NVC: A Unified AutoRegressive Framework for Memory-Efficient Neural Video Compression
# IEEE TCSVT 2025 | DOI: 10.1109/TCSVT.2025.3603282
#
# Installation:
#   conda env create -f environment.yml
#   conda activate torch2
#
# Key Dependencies:
#   - PyTorch 2.2.1 (CUDA 11.8)
#   - Accelerate 0.28.0 (Distributed training)
#   - DeepSpeed 0.14.0 (Optimization)
#   - CompressAI 1.2.4 (Compression tools)
#   - TorchAC 0.9.3 (Arithmetic coding)

