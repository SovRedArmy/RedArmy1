
train_cfg:
  # lr: 0.002
  local_pbar  : True
  batchsize   : 1

  # epochs        : 15
  # local_epochs  : 6
  data_multiple : 100

compression_cfg:
  q_mode: 'PQ'
  q_mode: 'QAT'
  q_mode: 'QEC'

model_cfg:
  model: HNeRV

  conv_type: ["convnext", "pshuffel"]
  act: gelu
  norm: none  
  enc_strds: [5, 4, 4, 3, 2]
  enc_dim: '64_16'
  dec_strds: [5, 4, 4, 3, 2]
  ks: '0_1_5'
  reduce: 1.2   
  modelsize: 0.3
  lower_width: 12

#------------------------------ UVG -----------------------------
dataset_cfg:
  crop_list: '960_1920'
  resize_list: '-1'