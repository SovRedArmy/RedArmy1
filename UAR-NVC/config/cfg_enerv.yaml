
train_cfg:
  # lr: 0.002
  local_pbar  : True
  batchsize   : 1

  # epochs        : 15
  # local_epochs  : 6
  data_multiple : 100

compression_cfg:
  q_mode: 'PQ'
  q_mode: 'QAT'
  q_mode: 'QEC'

model_cfg:
  model: ENeRV

  
  # pe related
  pos_b: 1.25
  pos_l: 80
  xypos_b: 1.25
  xypos_l: 80
  pos_b_tm: 1.25
  pos_l_tm: 80
  stem_dim_num: '512'
  fc_hw_dim: '9_16_196'
  act: gelu
  stride_list: [5, 3, 2, 2, 2]
  expansion: 3
  reduction: 2
  lower_width: 96
  num_blocks: 1
  bias: true
  norm: none
  conv_type: conv
  sin_res: true
  sigmoid: true
  block_dim: 256
  mlp_dim: 128
  head_dim: 64
  additional_loss: false
  additional_loss_weight: 100.0
  # modelsize: 0.3

#------------------------------ UVG -----------------------------
dataset_cfg:
  crop_list: '-1'
  resize_list: '1080_1920'
  # crop_list: '960_1920'
  # resize_list: '-1'