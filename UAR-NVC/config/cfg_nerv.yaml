
train_cfg:
  # lr: 0.002
  local_pbar  : True
  batchsize   : 1

  # epochs        : 15
  # local_epochs  : 6
  data_multiple : 100

compression_cfg:
  q_mode: 'PQ'
  q_mode: 'QAT'
  q_mode: 'QEC'

model_cfg:
  model: NeRV

  lower_width: 96
  num_blocks: 1
  embed: '1.25_40'
  stem_dim_num: '512_1'
  reduction: 2
  fc_hw_dim: '9_16_26'
  expansion: 1
  sin_res: Ture
  stride_list: [5, 3, 2, 2, 2]
  conv_type: conv
  norm: 'none'
  act: swish 
  bias: True
  sigmoid: True
  # modelsize: 0.3

#------------------------------ UVG -----------------------------
dataset_cfg:
  crop_list: '-1'
  resize_list: '1080_1920'
  # crop_list: '960_1920'
  # resize_list: '-1'